services:
  db:
    image: postgres:18-alpine
    container_name: albina_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-albina_dev}
      POSTGRES_USER: ${POSTGRES_USER:-albina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-albina_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - albina_dev_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-albina} -d ${POSTGRES_DB:-albina_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  albina_dev_db_data:
